apiVersion: mojaloop.io/v1
kind: MojaloopReport
metadata:
  name: hubwide
  namespace: default
  generation: 1
spec:
  endpoint:
    path: /hubwide
    params:
      - name: currency
        required: true
  queries:
    - name: participants
      query: |
        SELECT name, currency FROM participant WHERE currency = :currency
  template: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <title>Every participant</title>
    </head>
    <body>

    <table>
        <tr>
            <th>Name</th>
            <th>Currency</th>
        </tr>
        <% for(let p of participants) { %>
            <tr>
                <td><%= p.name %></td>
                <td><%= p.currency %></td>
            </tr>
        <% } %>
    </table>

    </body>
    </html>
